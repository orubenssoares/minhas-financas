<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Minhas Finanças</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  body { background:#0f172a; color:#e2e8f0; font-family:'Inter',system-ui,sans-serif; }
  .card { background:#1e293b; border:1px solid #334155; border-radius:12px; }
  .tab-btn { padding:8px 16px; border-radius:8px; font-size:14px; font-weight:500; cursor:pointer; transition:all .2s; color:#94a3b8; }
  .tab-btn.active { background:#3b82f6; color:#fff; }
  .tab-btn:hover:not(.active) { background:#334155; color:#e2e8f0; }
  .btn { padding:8px 16px; border-radius:8px; font-size:14px; font-weight:500; cursor:pointer; transition:all .2s; border:none; }
  .btn-primary { background:#3b82f6; color:#fff; } .btn-primary:hover { background:#2563eb; }
  .btn-success { background:#10b981; color:#fff; } .btn-success:hover { background:#059669; }
  .btn-danger  { background:#ef4444; color:#fff; } .btn-danger:hover  { background:#dc2626; }
  .btn-ghost   { background:#334155; color:#e2e8f0; } .btn-ghost:hover  { background:#475569; }
  .inp { width:100%; background:#0f172a; border:1px solid #334155; border-radius:8px; padding:8px 12px; color:#e2e8f0; font-size:14px; outline:none; }
  .inp:focus { border-color:#3b82f6; }
  select.inp option { background:#1e293b; }
  .badge { display:inline-block; padding:2px 8px; border-radius:20px; font-size:11px; font-weight:600; }
  .insight { border-radius:10px; padding:10px 14px; margin-bottom:8px; font-size:13px; border-left:4px solid; }
  .insight-error  { background:#450a0a; border-color:#ef4444; color:#fca5a5; }
  .insight-warn   { background:#422006; border-color:#f97316; color:#fdba74; }
  .insight-info   { background:#0c1a2e; border-color:#3b82f6; color:#93c5fd; }
  .insight-success{ background:#052e16; border-color:#10b981; color:#6ee7b7; }
  .modal-bg { position:fixed; inset:0; background:rgba(0,0,0,.7); z-index:50; display:flex; align-items:center; justify-content:center; padding:16px; }
  .modal { background:#1e293b; border:1px solid #334155; border-radius:16px; padding:24px; width:100%; max-width:480px; max-height:90vh; overflow-y:auto; }
  .progress-bar { height:6px; border-radius:3px; background:#334155; overflow:hidden; }
  .progress-fill { height:100%; border-radius:3px; transition:width .3s; }
  ::-webkit-scrollbar { width:6px; } ::-webkit-scrollbar-track { background:#1e293b; } ::-webkit-scrollbar-thumb { background:#475569; border-radius:3px; }
  .avatar { width:32px; height:32px; border-radius:50%; display:inline-flex; align-items:center; justify-content:center; font-size:13px; font-weight:700; color:#fff; flex-shrink:0; }
  #auth-page { display:flex; } #app-page { display:none; }
</style>
</head>
<body>

<!-- ═══════════════════ AUTH PAGE ═══════════════════ -->
<div id="auth-page" class="min-h-screen items-center justify-center p-4">
  <div class="card p-8 w-full max-w-md">
    <div class="text-center mb-6">
      <div class="text-4xl mb-2">💼</div>
      <h1 class="text-2xl font-bold text-white">Minhas Finanças</h1>
      <p class="text-slate-400 text-sm mt-1">Painel financeiro familiar</p>
    </div>

    <!-- Tab switcher -->
    <div class="flex gap-2 mb-6 bg-slate-800 p-1 rounded-lg">
      <button onclick="showAuthTab('login')" id="auth-tab-login" class="tab-btn active flex-1 text-center">Entrar</button>
      <button onclick="showAuthTab('register')" id="auth-tab-register" class="tab-btn flex-1 text-center">Criar conta</button>
    </div>

    <!-- Login form -->
    <form id="login-form" onsubmit="doLogin(event)" class="space-y-4">
      <div>
        <label class="text-sm text-slate-400 block mb-1">E-mail</label>
        <input type="email" id="login-email" class="inp" placeholder="seu@email.com" required>
      </div>
      <div>
        <label class="text-sm text-slate-400 block mb-1">Senha</label>
        <input type="password" id="login-pass" class="inp" placeholder="••••••" required>
      </div>
      <div id="login-err" class="text-red-400 text-sm hidden"></div>
      <button type="submit" class="btn btn-primary w-full">Entrar</button>
    </form>

    <!-- Register form -->
    <form id="register-form" onsubmit="doRegister(event)" class="space-y-4 hidden">
      <div>
        <label class="text-sm text-slate-400 block mb-1">Seu nome</label>
        <input type="text" id="reg-name" class="inp" placeholder="Nome completo" required>
      </div>
      <div>
        <label class="text-sm text-slate-400 block mb-1">E-mail</label>
        <input type="email" id="reg-email" class="inp" placeholder="seu@email.com" required>
      </div>
      <div>
        <label class="text-sm text-slate-400 block mb-1">Senha</label>
        <input type="password" id="reg-pass" class="inp" placeholder="Mínimo 6 caracteres" required>
      </div>
      <hr class="border-slate-700">
      <div>
        <label class="text-sm text-slate-400 block mb-1">Código de convite <span class="text-slate-500">(opcional)</span></label>
        <input type="text" id="reg-invite" class="inp" placeholder="XXXXXX — para entrar em uma casa existente">
        <p class="text-xs text-slate-500 mt-1">Deixe em branco para criar uma casa nova</p>
      </div>
      <div id="reg-house-wrap">
        <label class="text-sm text-slate-400 block mb-1">Nome da casa</label>
        <input type="text" id="reg-house" class="inp" placeholder="Ex: Família Silva" required>
      </div>
      <div id="reg-err" class="text-red-400 text-sm hidden"></div>
      <button type="submit" class="btn btn-primary w-full">Criar conta</button>
    </form>
  </div>
</div>

<!-- ═══════════════════ APP PAGE ═══════════════════ -->
<div id="app-page" class="min-h-screen">
  <!-- Top bar -->
  <header class="sticky top-0 z-40 bg-slate-900 border-b border-slate-700 px-4 py-3 flex items-center justify-between">
    <div class="flex items-center gap-3">
      <span class="text-xl">💼</span>
      <span class="font-bold text-white hidden sm:block">Minhas Finanças</span>
      <span id="hh-name" class="text-xs text-slate-400 hidden sm:block"></span>
    </div>
    <div class="flex items-center gap-3">
      <div id="user-avatar" class="avatar" style="background:#3b82f6">U</div>
      <span id="user-name" class="text-sm text-slate-300 hidden sm:block"></span>
      <button onclick="doLogout()" class="btn btn-ghost text-xs px-3 py-1">Sair</button>
    </div>
  </header>

  <!-- Month nav -->
  <div class="px-4 py-3 flex items-center gap-3 bg-slate-900/50 border-b border-slate-700/50">
    <button onclick="changeMonth(-1)" class="btn btn-ghost px-3 py-1 text-sm">‹</button>
    <span id="month-label" class="font-semibold text-white min-w-32 text-center"></span>
    <button onclick="changeMonth(1)" class="btn btn-ghost px-3 py-1 text-sm">›</button>
    <button onclick="goToday()" class="btn btn-ghost px-2 py-1 text-xs text-slate-400">Hoje</button>
  </div>

  <!-- Tabs -->
  <div class="px-4 py-2 flex gap-1 overflow-x-auto border-b border-slate-700/50 bg-slate-900/30">
    <button onclick="setTab('dashboard')" id="tab-dashboard" class="tab-btn active whitespace-nowrap">📊 Dashboard</button>
    <button onclick="setTab('agenda')"    id="tab-agenda"    class="tab-btn whitespace-nowrap">📅 Agenda</button>
    <button onclick="setTab('fixosvar')"  id="tab-fixosvar"  class="tab-btn whitespace-nowrap">📌 Fixos x Variáveis</button>
    <button onclick="setTab('transacoes')" id="tab-transacoes" class="tab-btn whitespace-nowrap">💳 Transações</button>
    <button onclick="setTab('familia')"   id="tab-familia"   class="tab-btn whitespace-nowrap">👥 Família</button>
    <button onclick="setTab('metas')"     id="tab-metas"     class="tab-btn whitespace-nowrap">🎯 Metas</button>
    <button onclick="setTab('categorias')" id="tab-categorias" class="tab-btn whitespace-nowrap">🏷️ Categorias</button>
  </div>

  <!-- Main content -->
  <main class="p-4 max-w-6xl mx-auto">
    <div id="view-dashboard"></div>
    <div id="view-agenda"    class="hidden"></div>
    <div id="view-fixosvar"  class="hidden"></div>
    <div id="view-transacoes" class="hidden"></div>
    <div id="view-familia"   class="hidden"></div>
    <div id="view-metas"     class="hidden"></div>
    <div id="view-categorias" class="hidden"></div>
  </main>
</div>

<!-- ═══════════════════ MODAL ═══════════════════ -->
<div id="modal" class="modal-bg hidden" onclick="if(event.target===this)closeModal()">
  <div class="modal" id="modal-body"></div>
</div>

<!-- ═══════════════════ TOAST ═══════════════════ -->
<div id="toast" style="position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);z-index:999;transition:transform .3s;pointer-events:none">
  <div id="toast-inner" style="padding:10px 20px;border-radius:10px;font-size:14px;font-weight:500;white-space:nowrap;box-shadow:0 4px 20px rgba(0,0,0,.4)"></div>
</div>

<script>
// ─── PDF.js worker ───────────────────────────────────────────
try { pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js'; } catch(e){}

// ─── State ───────────────────────────────────────────────────
let TOKEN = localStorage.getItem('fin_token') || '';
let ME = null;
let state = { transactions:[], categories:[], goals:[], bills:[], members:[], recurringBills:[] };
let projectedById = {};
let curYear = new Date().getFullYear();
let curMonth = new Date().getMonth() + 1;
let activeTab = 'dashboard';
let charts = {};

// ─── API ─────────────────────────────────────────────────────
async function api(method, path, body) {
  const opts = { method, headers: { 'Content-Type':'application/json', 'Authorization': 'Bearer ' + TOKEN } };
  if (body) opts.body = JSON.stringify(body);
  const r = await fetch(path, opts);
  const data = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(data.error || 'Erro na requisição');
  return data;
}

// ─── Toast ───────────────────────────────────────────────────
let toastTimer;
function showToast(msg, type = 'success') {
  const t = document.getElementById('toast');
  const inner = document.getElementById('toast-inner');
  const colors = { success: { bg:'#052e16', color:'#6ee7b7', border:'#10b981' }, error: { bg:'#450a0a', color:'#fca5a5', border:'#ef4444' }, info: { bg:'#0c1a2e', color:'#93c5fd', border:'#3b82f6' } };
  const c = colors[type] || colors.info;
  inner.style.cssText = `background:${c.bg};color:${c.color};border:1px solid ${c.border};padding:10px 20px;border-radius:10px;font-size:14px;font-weight:500;white-space:nowrap;box-shadow:0 4px 20px rgba(0,0,0,.4)`;
  inner.textContent = msg;
  t.style.transform = 'translateX(-50%) translateY(0)';
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { t.style.transform = 'translateX(-50%) translateY(80px)'; }, 3000);
}

function showModalError(msg) {
  let el = document.getElementById('modal-err');
  if (!el) {
    el = document.createElement('div');
    el.id = 'modal-err';
    el.style.cssText = 'background:#450a0a;color:#fca5a5;border-left:4px solid #ef4444;border-radius:8px;padding:10px 14px;font-size:13px;margin-top:8px';
    const form = document.querySelector('#modal-body form');
    if (form) form.appendChild(el);
  }
  el.textContent = msg;
  el.style.display = 'block';
}

function setBtnLoading(btn, loading) {
  if (!btn) return;
  if (loading) { btn.disabled = true; btn.dataset.orig = btn.textContent; btn.textContent = 'Salvando...'; }
  else { btn.disabled = false; btn.textContent = btn.dataset.orig || 'Salvar'; }
}

// ─── Helpers ─────────────────────────────────────────────────
const fmt  = v => 'R$ ' + (+v||0).toLocaleString('pt-BR', {minimumFractionDigits:2, maximumFractionDigits:2});
const escH = s => (s||'').toString().replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
function parseDate(s) { if(!s) return null; const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); }
function fmtDate(s) { const d = parseDate(s); if(!d) return ''; return d.toLocaleDateString('pt-BR'); }
function today() { const n = new Date(); return `${n.getFullYear()}-${String(n.getMonth()+1).padStart(2,'0')}-${String(n.getDate()).padStart(2,'0')}`; }
function daysUntil(dateStr) { return Math.round((parseDate(dateStr) - parseDate(today())) / 86400000); }
function monthsUntil(dateStr) { return Math.max(1, Math.ceil(daysUntil(dateStr) / 30.44)); }
function dueLabel(dateStr) {
  const d = daysUntil(dateStr);
  if (d < 0) return `venceu há ${-d}d`;
  if (d === 0) return 'vence hoje';
  if (d === 1) return 'vence amanhã';
  return `vence em ${d}d`;
}
function monthLabel(y, m) { return new Date(y, m-1, 1).toLocaleDateString('pt-BR', {month:'long', year:'numeric'}); }
function catColor(name) { const c = state.categories.find(c=>c.name===name); return c?.color || '#6b7280'; }
function catLimit(name) { const c = state.categories.find(c=>c.name===name); return c?.limit || 0; }
function memberName(id) { if(!id) return null; const m = state.members.find(m=>m.id===id); return m?.name || null; }
function memberInitial(id) { const n = memberName(id); return n ? n[0].toUpperCase() : '?'; }
function memberColor(id) { if(!id) return '#6b7280'; const m = state.members.find(m=>m.id===id); return m?.color || '#6b7280'; }

function txInMonth(year, month) {
  const ys = String(year), ms = String(month).padStart(2,'0');
  return state.transactions.filter(t => t.date && t.date.startsWith(ys+'-'+ms));
}

// ─── AUTH ─────────────────────────────────────────────────────
function showAuthTab(tab) {
  document.getElementById('login-form').classList.toggle('hidden', tab !== 'login');
  document.getElementById('register-form').classList.toggle('hidden', tab !== 'register');
  document.getElementById('auth-tab-login').classList.toggle('active', tab === 'login');
  document.getElementById('auth-tab-register').classList.toggle('active', tab === 'register');
}

document.getElementById('reg-invite').addEventListener('input', function() {
  document.getElementById('reg-house-wrap').style.display = this.value.trim() ? 'none' : '';
  document.getElementById('reg-house').required = !this.value.trim();
});

async function doLogin(e) {
  e.preventDefault();
  const err = document.getElementById('login-err');
  err.classList.add('hidden');
  try {
    const d = await api('POST', '/api/auth/login', { email: document.getElementById('login-email').value, password: document.getElementById('login-pass').value });
    TOKEN = d.token; localStorage.setItem('fin_token', TOKEN); ME = d.user;
    startApp();
  } catch(ex) { err.textContent = ex.message; err.classList.remove('hidden'); }
}

async function doRegister(e) {
  e.preventDefault();
  const err = document.getElementById('reg-err');
  err.classList.add('hidden');
  try {
    const d = await api('POST', '/api/auth/register', {
      name: document.getElementById('reg-name').value,
      email: document.getElementById('reg-email').value,
      password: document.getElementById('reg-pass').value,
      inviteCode: document.getElementById('reg-invite').value || undefined,
      householdName: document.getElementById('reg-house').value || undefined,
    });
    TOKEN = d.token; localStorage.setItem('fin_token', TOKEN); ME = d.user;
    startApp();
  } catch(ex) { err.textContent = ex.message; err.classList.remove('hidden'); }
}

async function doLogout() {
  try { await api('POST', '/api/auth/logout'); } catch(e){}
  localStorage.removeItem('fin_token');
  TOKEN = ''; ME = null;
  document.getElementById('auth-page').style.display = 'flex';
  document.getElementById('app-page').style.display = 'none';
}

// ─── BOOT ─────────────────────────────────────────────────────
async function boot() {
  if (!TOKEN) return;
  try {
    ME = await api('GET', '/api/auth/me');
    startApp();
  } catch(e) { localStorage.removeItem('fin_token'); TOKEN = ''; }
}

async function startApp() {
  document.getElementById('auth-page').style.display = 'none';
  document.getElementById('app-page').style.display = 'block';
  document.getElementById('user-avatar').textContent = ME.name[0].toUpperCase();
  document.getElementById('user-avatar').style.background = ME.color || '#3b82f6';
  document.getElementById('user-name').textContent = ME.name;
  document.getElementById('hh-name').textContent = ME.householdName || '';
  updateMonthLabel();
  await loadAll();
  render();
}

async function loadAll() {
  const ys = curYear, ms = curMonth;
  const [txs, cats, goals, bills, members, recurringBills] = await Promise.all([
    api('GET', `/api/transactions?year=${ys}&month=${ms}`),
    api('GET', '/api/categories'),
    api('GET', '/api/goals'),
    api('GET', `/api/bills?year=${ys}&month=${ms}`),
    api('GET', '/api/members'),
    api('GET', '/api/bills?recurring=1'),
  ]);
  state.transactions = txs;
  state.categories = cats;
  state.goals = goals;
  state.bills = bills;
  state.members = members;
  state.recurringBills = recurringBills;
}

function updateMonthLabel() {
  document.getElementById('month-label').textContent = monthLabel(curYear, curMonth).replace(/^\w/, c => c.toUpperCase());
}

async function changeMonth(delta) {
  curMonth += delta;
  if (curMonth > 12) { curMonth = 1; curYear++; }
  if (curMonth < 1)  { curMonth = 12; curYear--; }
  updateMonthLabel();
  await loadAll();
  render();
}

function goToday() {
  const n = new Date();
  curYear = n.getFullYear(); curMonth = n.getMonth() + 1;
  updateMonthLabel();
  loadAll().then(render);
}

function goToMonth(y, m) {
  curYear = y; curMonth = m;
  updateMonthLabel();
  loadAll().then(render);
}

// ─── TABS ─────────────────────────────────────────────────────
function setTab(tab) {
  activeTab = tab;
  ['dashboard','agenda','fixosvar','transacoes','familia','metas','categorias'].forEach(t => {
    document.getElementById('view-'+t).classList.toggle('hidden', t !== tab);
    document.getElementById('tab-'+t).classList.toggle('active', t === tab);
  });
  renderTab(tab);
}

function render() { renderTab(activeTab); }

function renderTab(tab) {
  destroyCharts();
  if (tab === 'dashboard')   renderDashboard();
  else if (tab === 'agenda') renderAgenda();
  else if (tab === 'fixosvar') renderFixosVariaveis();
  else if (tab === 'transacoes') renderTransacoes();
  else if (tab === 'familia')    renderFamilia();
  else if (tab === 'metas')      renderMetas();
  else if (tab === 'categorias') renderCategorias();
}

function destroyCharts() {
  Object.values(charts).forEach(c => { try { c.destroy(); } catch(e){} });
  charts = {};
}

// ─── DASHBOARD ────────────────────────────────────────────────
function renderDashboard() {
  const txs = txInMonth(curYear, curMonth);
  const income  = txs.filter(t=>t.type==='income').reduce((a,t)=>a+t.amount,0);
  const expense = txs.filter(t=>t.type==='expense').reduce((a,t)=>a+t.amount,0);
  const balance = income - expense;
  const savings = income > 0 ? (balance/income*100) : 0;

  const byCategory = {};
  txs.filter(t=>t.type==='expense').forEach(t => { byCategory[t.category] = (byCategory[t.category]||0) + t.amount; });

  const pendingBills = state.bills.filter(b=>b.status==='pending');
  const toPay = pendingBills.filter(b=>b.type==='bill').reduce((a,b)=>a+b.amount,0);
  const toReceive = pendingBills.filter(b=>b.type==='receivable').reduce((a,b)=>a+b.amount,0);
  const projectedBalance = balance + toReceive - toPay;

  const insights = generateInsights(txs);

  const el = document.getElementById('view-dashboard');
  el.innerHTML = `
    <!-- KPI row -->
    <div class="grid grid-cols-2 sm:grid-cols-5 gap-3 mb-4">
      <div class="card p-4">
        <div class="text-xs text-slate-400 mb-1">Receitas</div>
        <div class="text-lg font-bold text-emerald-400">${fmt(income)}</div>
      </div>
      <div class="card p-4">
        <div class="text-xs text-slate-400 mb-1">Despesas</div>
        <div class="text-lg font-bold text-red-400">${fmt(expense)}</div>
      </div>
      <div class="card p-4">
        <div class="text-xs text-slate-400 mb-1">Saldo</div>
        <div class="text-lg font-bold ${balance>=0?'text-emerald-400':'text-red-400'}">${fmt(balance)}</div>
      </div>
      <div class="card p-4" title="Saldo atual + contas a receber pendentes − contas a pagar pendentes deste mês">
        <div class="text-xs text-slate-400 mb-1">Saldo projetado</div>
        <div class="text-lg font-bold ${projectedBalance>=0?'text-emerald-400':'text-red-400'}">${fmt(projectedBalance)}</div>
      </div>
      <div class="card p-4">
        <div class="text-xs text-slate-400 mb-1">Taxa de poupança</div>
        <div class="text-lg font-bold ${savings>=20?'text-emerald-400':savings>=10?'text-yellow-400':'text-red-400'}">${savings.toFixed(1)}%</div>
      </div>
    </div>

    <!-- Agenda mini + insights -->
    <div class="grid grid-cols-1 lg:grid-cols-2 gap-4 mb-4">
      <div class="card p-4">
        <div class="flex items-center justify-between mb-3">
          <h3 class="font-semibold text-white">📅 Agenda do mês</h3>
          <button onclick="setTab('agenda')" class="text-xs text-blue-400 hover:underline">Ver tudo</button>
        </div>
        ${renderAgendaMini(pendingBills, toPay, toReceive)}
      </div>
      <div class="card p-4">
        <h3 class="font-semibold text-white mb-3">💡 Insights</h3>
        <div id="insights-box">
          ${insights.length ? insights.map(i=>`<div class="insight insight-${i.level}">${escH(i.text)}</div>`).join('') : '<p class="text-slate-400 text-sm">Sem insights ainda. Adicione transações para começar.</p>'}
        </div>
      </div>
    </div>

    <!-- Charts row -->
    <div class="grid grid-cols-1 lg:grid-cols-2 gap-4 mb-4">
      <div class="card p-4">
        <h3 class="font-semibold text-white mb-3">Gastos por categoria</h3>

function renderCatLimits(byCategory) {
  const cats = state.categories.filter(c => c.limit > 0);
  if (!cats.length) return '<p class="text-slate-400 text-sm">Configure limites nas categorias</p>';
  return cats.map(c => {
    const spent = byCategory[c.name] || 0;
    const pct = c.limit > 0 ? Math.min((spent/c.limit)*100, 100) : 0;
    const over = spent > c.limit;
    const color = over ? '#ef4444' : pct > 80 ? '#f97316' : '#10b981';
    return `<div class="mb-3">
      <div class="flex justify-between text-xs mb-1">
        <span style="color:${c.color}">${over?'🔴 ':''}${escH(c.name)}</span>
        <span class="${over?'text-red-400':'text-slate-400'}">${fmt(spent)} / ${fmt(c.limit)}</span>
      </div>
      <div class="progress-bar"><div class="progress-fill" style="width:${pct}%;background:${color}"></div></div>
    </div>`;
  }).join('');
}

// ─── INSIGHTS ─────────────────────────────────────────────────
function generateInsights(txs) {
  const insights = [];
  const today_ = today();
  const todayDate = parseDate(today_);
  const dayOfMonth = todayDate.getDate();
  const daysInMonth = new Date(curYear, curMonth, 0).getDate();
  const monthProgress = dayOfMonth / daysInMonth;

  const isCurrentMonth = curYear === todayDate.getFullYear() && curMonth === todayDate.getMonth() + 1;

  const byCategory = {};
  txs.filter(t=>t.type==='expense').forEach(t => { byCategory[t.category] = (byCategory[t.category]||0) + t.amount; });
  const totalExpense = Object.values(byCategory).reduce((a,b)=>a+b,0);
  const totalIncome = txs.filter(t=>t.type==='income').reduce((a,t)=>a+t.amount,0);

  // Over limit warnings
  state.categories.forEach(cat => {
    if (!cat.limit) return;
    const spent = byCategory[cat.name] || 0;
    if (spent > cat.limit) insights.push({ level:'error', text:`🚫 ${cat.name}: você ultrapassou o limite em ${fmt(spent - cat.limit)} (${fmt(spent)} de ${fmt(cat.limit)})` });
    else if (isCurrentMonth && spent/cat.limit > 0.8 && monthProgress < 0.8) insights.push({ level:'warn', text:`⚠️ ${cat.name}: ${((spent/cat.limit)*100).toFixed(0)}% do limite usado com ${(monthProgress*100).toFixed(0)}% do mês — vá devagar!` });
  });

  // Savings rate
  if (totalIncome > 0) {
    const sav = (totalIncome - totalExpense)/totalIncome;
    if (sav < 0) insights.push({ level:'error', text:`💸 Você gastou ${fmt(totalExpense - totalIncome)} a mais do que recebeu este mês!` });
    else if (sav < 0.1) insights.push({ level:'warn', text:`💰 Taxa de poupança muito baixa: ${(sav*100).toFixed(1)}%. Tente poupar ao menos 10% da renda.` });
    else if (sav >= 0.2) insights.push({ level:'success', text:`✅ Ótima taxa de poupança: ${(sav*100).toFixed(1)}% da renda guardada!` });
  }

  // Top category
  const topCat = Object.entries(byCategory).sort((a,b)=>b[1]-a[1])[0];
  if (topCat && totalExpense > 0) {
    const pct = (topCat[1]/totalExpense*100).toFixed(0);
    if (+pct > 40) insights.push({ level:'warn', text:`📊 ${topCat[0]} representa ${pct}% dos gastos (${fmt(topCat[1])}). Avalie se está dentro do planejado.` });
  }

  // Pending bills
  const overdueBills = state.bills.filter(b=>b.status==='pending' && b.type==='bill' && b.dueDate < today_);
  if (overdueBills.length) insights.push({ level:'error', text:`🔴 ${overdueBills.length} conta(s) vencida(s): ${overdueBills.map(b=>b.description).join(', ')}` });

  const upcomingBills = state.bills.filter(b=>{
    if (b.status!=='pending' || b.type!=='bill') return false;
    const diff = (parseDate(b.dueDate) - todayDate) / 86400000;
    return diff >= 0 && diff <= 5;
  });
  if (upcomingBills.length && isCurrentMonth) insights.push({ level:'info', text:`📆 ${upcomingBills.length} conta(s) vencem nos próximos 5 dias: ${upcomingBills.map(b=>b.description).join(', ')}` });

  // Month-end balance projection (actual so far + pending bills still due this month)
  if (isCurrentMonth) {
    const pending = state.bills.filter(b=>b.status==='pending');
    const pendingPay = pending.filter(b=>b.type==='bill').reduce((a,b)=>a+b.amount,0);
    const pendingRecv = pending.filter(b=>b.type==='receivable').reduce((a,b)=>a+b.amount,0);
    const projected = (totalIncome - totalExpense) + pendingRecv - pendingPay;
    if (projected < 0) insights.push({ level:'error', text:`📉 Com as contas pendentes deste mês, o saldo projetado fecha negativo em ${fmt(-projected)}.` });
  }

  return insights.slice(0, 7);
}

// ─── AGENDA ───────────────────────────────────────────────────
function billSeriesKey(b) {
  return [b.type, b.description, b.category, b.memberId||''].join('|');
}

// Shifts a YYYY-MM-DD date forward by n months, clamping the day to the target month's length.
function addMonths(dateStr, n) {
  const [y,m,d] = dateStr.split('-').map(Number);
  const dt = new Date(y, m-1+n, 1);
  const lastDay = new Date(dt.getFullYear(), dt.getMonth()+1, 0).getDate();
  return `${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,'0')}-${String(Math.min(d,lastDay)).padStart(2,'0')}`;
}

// Rough month-by-month forecast (recurring items only, rolled forward from each
// series' latest known occurrence) — used for the dashboard's "next months" outlook.
function recurringForecast(n) {
  const latestBySeries = {};
  state.recurringBills.forEach(b => {
    const key = billSeriesKey(b);
    if (!latestBySeries[key] || b.dueDate > latestBySeries[key].dueDate) latestBySeries[key] = b;
  });
  const now = new Date();
  const months = [];
  for (let i = 0; i < n; i++) {
    const d = new Date(now.getFullYear(), now.getMonth()+i, 1);
    const y = d.getFullYear(), m = d.getMonth()+1;
    const targetKey = `${y}-${String(m).padStart(2,'0')}`;
    let toPay = 0, toReceive = 0;
    Object.values(latestBySeries).forEach(base => {
      let cursor = base.dueDate;
      while (cursor.slice(0,7) < targetKey) cursor = addMonths(cursor, 1);
      if (cursor.slice(0,7) === targetKey) {
        if (base.type === 'bill') toPay += base.amount; else toReceive += base.amount;
      }
    });
    months.push({ y, m, toPay, toReceive, saldo: toReceive - toPay, label: monthLabel(y, m) });
  }
  return months;
}

// Projects recurring bills/receivables forward into months that have no real row yet,
// so future months aren't just empty — the user sees what's expected to repeat.
function projectedBillsFor(year, month) {
  const targetKey = `${year}-${String(month).padStart(2,'0')}`;
  const latestBySeries = {};
  state.recurringBills.forEach(b => {
    const key = billSeriesKey(b);
    if (!latestBySeries[key] || b.dueDate > latestBySeries[key].dueDate) latestBySeries[key] = b;
  });
  const projected = [];
  Object.values(latestBySeries).forEach(base => {
    if (base.dueDate.slice(0,7) >= targetKey) return; // a real row already exists at/after this month
    let cursorDate = base.dueDate;
    while (cursorDate.slice(0,7) < targetKey) cursorDate = addMonths(cursorDate, 1);
    const id = `proj-${billSeriesKey(base)}-${targetKey}`;
    const p = { ...base, id, dueDate: cursorDate, status: 'projected', _projected: true };
    projectedById[id] = p;
    projected.push(p);
  });
  return projected;
}

async function confirmProjectedBill(id) {
  const b = projectedById[id];
  if (!b) return;
  try {
    await api('POST', '/api/bills', { type: b.type, description: b.description, amount: b.amount, dueDate: b.dueDate, category: b.category, isRecurring: true, memberId: b.memberId });
    await loadAll(); render();
    showToast('Item confirmado na agenda', 'success');
  } catch(err) { showToast(err.message, 'error'); }
}

function renderMonthStrip() {
  const n = new Date();

  for (let i = -6; i <= 2; i++) {
    const d = new Date(n.getFullYear(), n.getMonth()+i, 1);
    chips.push({ y: d.getFullYear(), m: d.getMonth()+1 });
  }
  return `<div class="flex gap-2 overflow-x-auto mb-4 pb-1">
    ${chips.map(c => {
      const isToday = c.y === n.getFullYear() && c.m === n.getMonth()+1;
      const isSelected = c.y === curYear && c.m === curMonth;
      const label = new Date(c.y, c.m-1, 1).toLocaleDateString('pt-BR', {month:'short'}).replace('.','');
      const showYear = c.y !== n.getFullYear();
      return `<button onclick="goToMonth(${c.y},${c.m})" class="flex-shrink-0 px-3 py-1.5 rounded-lg text-xs font-medium border ${isSelected ? 'bg-blue-600 border-blue-600 text-white' : isToday ? 'border-blue-500 text-blue-400' : 'border-slate-700 text-slate-400 hover:border-slate-500'}">
        ${label.charAt(0).toUpperCase()+label.slice(1)}${showYear ? '/'+String(c.y).slice(2) : ''}${isToday ? ' · hoje' : ''}

    }).join('')}

}

function renderBillList(bills, today_) {
  if (!bills.length) return '<p class="text-slate-400 text-sm text-center py-4">Nenhum item</p>';
  return bills.map(b => {
    const member = b.memberId ? `<span class="ml-1" style="color:${memberColor(b.memberId)}">· ${escH(memberName(b.memberId)||'')}</span>` : '';
    if (b._projected) {
      return `<div class="flex items-center gap-2 py-2 border-b border-slate-700/30 opacity-70">
        <div class="flex-1">
          <div class="text-sm font-medium text-slate-300">${escH(b.description)} 🔮</div>
          <div class="text-xs text-amber-400/80">${fmtDate(b.dueDate)} · ${escH(b.category)}${member} · projetado</div>
        </div>
        <div class="font-semibold text-sm ${b.type==='bill'?'text-red-400':'text-emerald-400'}">${fmt(b.amount)}</div>
        <button onclick="confirmProjectedBill('${b.id}')" class="btn btn-ghost text-xs px-2 py-1">Confirmar</button>
      </div>`;
    }
    const isPending = b.status === 'pending';
    const overdue = isPending && b.dueDate < today_;
    const dateCss = overdue ? 'text-red-400' : 'text-slate-400';
    return `<div class="flex items-center gap-2 py-2 border-b border-slate-700/30">
      <div class="flex-1">
        <div class="text-sm font-medium ${isPending?'text-slate-200':'text-slate-500 line-through'}">${escH(b.description)}${b.isRecurring?' 🔁':''}</div>
        <div class="text-xs ${dateCss}">${fmtDate(b.dueDate)} · ${escH(b.category)}${member}</div>
      </div>
      <div class="font-semibold text-sm ${b.type==='bill'?'text-red-400':'text-emerald-400'}">${fmt(b.amount)}</div>

      <button onclick="openBillModal('${b.id}')" class="text-xs text-slate-500 hover:text-blue-400 px-1">✏</button>
      <button onclick="deleteBill('${b.id}')" class="text-xs text-slate-500 hover:text-red-400 px-1">✕</button>
    </div>`;
  }).join('');
}

async function markBillDone(id) {
  try {
    await api('POST', `/api/bills/${id}/done`);
    await loadAll(); render();
    showToast('Marcado como pago!', 'success');

async function deleteBill(id) {
  if (!confirm('Excluir este item?')) return;
  try {

    showToast('Item excluído', 'info');

}

// ─── FIXOS x VARIÁVEIS ──────────────────────────────────────────
// Combines what already happened (transactions, flagged fixo/variável) with what's
// still scheduled (Agenda bills — recurring ones count as fixo, one-off as variável),
// so both columns show every cost for the month with its payment date.
function fixedVariableSplit(year, month) {
  const expenseTxs = txInMonth(year, month).filter(t => t.type === 'expense');
  const toItem = (source, status) => x => ({
    date: source === 'tx' ? x.date : x.dueDate,
    description: x.description,
    category: x.category,
    amount: x.amount,
    status,
    memberId: x.memberId,
  });

  const pendingBills = state.bills.filter(b => b.type === 'bill' && b.status === 'pending');

  const fixed = [
    ...expenseTxs.filter(t => t.isFixed).map(toItem('tx', 'pago')),
    ...pendingBills.filter(b => b.isRecurring).map(toItem('bill', 'pendente')),
  ].sort((a,b) => a.date.localeCompare(b.date));

  const variable = [
    ...expenseTxs.filter(t => !t.isFixed).map(toItem('tx', 'pago')),
    ...pendingBills.filter(b => !b.isRecurring).map(toItem('bill', 'pendente')),
  ].sort((a,b) => a.date.localeCompare(b.date));

  return { fixed, variable };
}

function renderFixosVariaveis() {
  const el = document.getElementById('view-fixosvar');
  const { fixed, variable } = fixedVariableSplit(curYear, curMonth);
  const totalFixed = fixed.reduce((a,x) => a+x.amount, 0);
  const totalVariable = variable.reduce((a,x) => a+x.amount, 0);
  const total = totalFixed + totalVariable;
  const fixedPct = total > 0 ? (totalFixed/total*100) : 0;

  el.innerHTML = `
    <div class="flex items-center justify-between mb-4">
      <h2 class="text-lg font-bold text-white">Fixos x Variáveis — ${monthLabel(curYear, curMonth)}</h2>
    </div>
    <div class="grid grid-cols-3 gap-3 mb-2">
      <div class="card p-3 text-center"><div class="text-xs text-slate-400">Custos fixos</div><div class="font-bold text-blue-400">${fmt(totalFixed)}</div></div>
      <div class="card p-3 text-center"><div class="text-xs text-slate-400">Custos variáveis</div><div class="font-bold text-orange-400">${fmt(totalVariable)}</div></div>
      <div class="card p-3 text-center"><div class="text-xs text-slate-400">Total</div><div class="font-bold text-slate-200">${fmt(total)}</div></div>
    </div>

      <p class="text-xs text-slate-500 mb-4">${fixedPct.toFixed(0)}% fixo · ${(100-fixedPct).toFixed(0)}% variável</p>

    <div class="grid grid-cols-1 lg:grid-cols-2 gap-4">
      <div class="card p-4">
        <h3 class="font-semibold text-blue-400 mb-3">📌 Custos fixos</h3>

function renderFixedVarList(items) {
  if (!items.length) return '<p class="text-slate-400 text-sm text-center py-4">Nenhum item</p>';
  const today_ = today();
  return items.map(x => {
    const member = x.memberId ? `<span class="ml-1" style="color:${memberColor(x.memberId)}">· ${escH(memberName(x.memberId)||'')}</span>` : '';
    const isPending = x.status === 'pendente';
    const overdue = isPending && x.date < today_;
    const dateLabel = isPending ? `${fmtDate(x.date)} · ${dueLabel(x.date)}` : fmtDate(x.date);
    return `<div class="flex items-center gap-2 py-2 border-b border-slate-700/30">
      <div class="flex-1">
        <div class="text-sm font-medium text-slate-200">${escH(x.description)}</div>
        <div class="text-xs ${overdue?'text-red-400':'text-slate-400'}">${dateLabel} · ${escH(x.category)}${member}</div>
      </div>
      <div class="font-semibold text-sm text-slate-200">${fmt(x.amount)}</div>
      <span class="text-xs px-2 py-0.5 rounded-full ${isPending ? (overdue?'bg-red-500/20 text-red-400':'bg-amber-500/20 text-amber-400') : 'bg-emerald-500/20 text-emerald-400'}">${isPending ? (overdue?'vencido':'pendente') : 'pago'}</span>
    </div>`;
  }).join('');
}

// ─── Color swatches ───────────────────────────────────────────
const COLORS = ['#3b82f6','#ec4899','#10b981','#f97316','#a855f7','#ef4444','#eab308','#06b6d4','#64748b','#f59e0b'];
function colorSwatches(selected, inputId) {
  const swatches = COLORS.map(c => {
    const isSelected = c === selected;
    return `<button type="button" onclick="selectColor('${inputId}','${c}',this)" title="${c}"
      style="width:28px;height:28px;border-radius:50%;background:${c};border:3px solid ${isSelected?'#fff':'transparent'};outline:${isSelected?'2px solid #3b82f6':'none'};cursor:pointer;transition:all .15s"
      data-color="${c}"></button>`;
  }).join('');
  return `<div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">
    ${swatches}
    <input type="hidden" id="${inputId}" value="${selected}">
  </div>`;
}
function selectColor(inputId, color, btn) {
  document.getElementById(inputId).value = color;
  btn.closest('div').querySelectorAll('button').forEach(b => {
    const sel = b.dataset.color === color;
    b.style.border = `3px solid ${sel ? '#fff' : 'transparent'}`;
    b.style.outline = sel ? '2px solid #3b82f6' : 'none';
  });
}

function memberOptions(selected='') {
  return `<option value="">— Sem integrante —</option>` +
    state.members.map(m => `<option value="${m.id}" ${m.id===selected?'selected':''}>${escH(m.name)}</option>`).join('');

async function saveTx(e, type, id) {
  e.preventDefault();
  const btn = e.target.querySelector('[type=submit]');
  setBtnLoading(btn, true);
  try {
    const amount = parseFloat(document.getElementById('tx-amt').value);
    const category = document.getElementById('tx-cat').value;
    if (type === 'expense' && category) {
      const cat = state.categories.find(c=>c.name===category);
      if (cat && cat.limit > 0) {
        const txs = txInMonth(curYear, curMonth);
        const existing = txs.filter(t=>t.type==='expense' && t.category===category && (!id || t.id!==id)).reduce((a,t)=>a+t.amount,0);
        const newTotal = existing + amount;
        if (newTotal > cat.limit) {
          if (!confirm(`⚠️ Esta transação levará "${category}" para ${fmt(newTotal)}, excedendo o limite de ${fmt(cat.limit)} em ${fmt(newTotal-cat.limit)}.\n\nDeseja continuar mesmo assim?`)) { setBtnLoading(btn, false); return; }
        }
      }
    }
    const body = {
      type, description: document.getElementById('tx-desc').value,
      amount, category,
      date: document.getElementById('tx-date').value,
      isFixed: document.getElementById('tx-fixed').checked,
      isRecurring: document.getElementById('tx-recur').checked,
      notes: document.getElementById('tx-notes').value,
      memberId: document.getElementById('tx-member').value || null,
    };
    if (id) await api('PUT', `/api/transactions/${id}`, body);
    else await api('POST', '/api/transactions', body);
    closeModal(); await loadAll(); render();
    showToast(id ? 'Transação atualizada' : 'Transação salva', 'success');
  } catch(err) { setBtnLoading(btn, false); showModalError(err.message); }
}

function openImportModal() {
  openModal(`
    <h3 class="font-bold text-white text-lg mb-2">Importar fatura</h3>
    <p class="text-slate-400 text-sm mb-4">Suporta PDF de faturas de cartão e arquivos CSV/XLS</p>
    <div class="space-y-3">
      <label class="block w-full border-2 border-dashed border-slate-600 rounded-xl p-6 text-center cursor-pointer hover:border-blue-500 transition-colors">
        <div class="text-3xl mb-2">📁</div>
        <div class="text-sm text-slate-300">Clique ou arraste o arquivo aqui</div>
        <div class="text-xs text-slate-500 mt-1">PDF, CSV, XLS, XLSX</div>
        <input type="file" accept=".pdf,.csv,.xls,.xlsx" class="hidden" onchange="handleImportFile(this.files[0])">
      </label>
      <div id="import-status" class="text-sm text-slate-400"></div>
      <div id="import-preview" class="max-h-64 overflow-y-auto"></div>
      <div id="import-actions" class="hidden flex gap-2">
        <button onclick="closeModal()" class="btn btn-ghost flex-1">Cancelar</button>
        <button onclick="confirmImport()" class="btn btn-primary flex-1">Importar selecionadas</button>
      </div>
    </div>
  `);
}

let pendingImports = [];

async function handleImportFile(file) {
  if (!file) return;
  document.getElementById('import-status').textContent = 'Processando...';
  pendingImports = [];
  try {
    if (file.name.endsWith('.pdf')) await parsePDFFile(file);
    else await parseSpreadsheetFile(file);
    showImportPreview();
  } catch(err) {
    document.getElementById('import-status').textContent = 'Erro: ' + err.message;
  }
}

async function parsePDFFile(file) {
  const buf = await file.arrayBuffer();
  const pdf = await pdfjsLib.getDocument({ data: buf }).promise;
  let lines = [];
  for (let i = 1; i <= pdf.numPages; i++) {
    const page = await pdf.getPage(i);
    const content = await page.getTextContent();
    const byY = {};
    content.items.forEach(item => {
      const y = Math.round(item.transform[5]);
      if (!byY[y]) byY[y] = [];
      byY[y].push({ x: item.transform[4], text: item.str });
    });
    Object.values(byY).sort((a,b)=>b[0].y-a[0].y).forEach(row => {
      row.sort((a,b)=>a.x-b.x);
      lines.push(row.map(i=>i.text).join(' '));
    });
  }
  pendingImports = parsePDFLines(lines);
}

function parsePDFLines(lines) {
  const dateRe = /\b(\d{2}\/\d{2}(?:\/\d{2,4})?)\b/;
  const amtRe  = /(\d{1,3}(?:\.\d{3})*(?:,\d{2})|(?:\d+),\d{2})\s*$/;
  const results = [];
  lines.forEach(line => {
    const dateM = line.match(dateRe);
    const amtM  = line.match(amtRe);
    if (!dateM || !amtM) return;
    const amtStr = amtM[1].replace(/\./g,'').replace(',','.');
    const amount = parseFloat(amtStr);
    if (!amount || amount <= 0 || amount > 50000) return;
    let desc = line.replace(dateM[0],'').replace(amtM[0],'').trim().replace(/\s+/g,' ');
    if (desc.length < 2 || desc.length > 100) return;
    const [d, m, y] = dateM[1].split('/');
    const year = y ? (y.length===2 ? '20'+y : y) : String(curYear);
    const dateStr = `${year}-${m.padStart(2,'0')}-${d.padStart(2,'0')}`;
    results.push({ description: desc, amount, date: dateStr, category: guessCategory(desc), selected: true });
  });
  return results;
}

async function parseSpreadsheetFile(file) {
  const buf = await file.arrayBuffer();
  const wb = XLSX.read(buf, { type:'array' });
  const ws = wb.Sheets[wb.SheetNames[0]];
  const rows = XLSX.utils.sheet_to_json(ws, { header:1 });
  rows.forEach(row => {
    if (!row || row.length < 2) return;
    let desc = '', amount = 0, date = today();
    row.forEach(cell => {
      const s = String(cell||'').trim();
      if (!desc && s.length > 2 && isNaN(+s)) desc = s;
      const n = parseFloat(String(s).replace(/[^\d,.]/g,'').replace(',','.'));
      if (!amount && n > 0 && n < 50000) amount = n;
      if (s.match(/^\d{2}\/\d{2}\/\d{4}$/)) { const [d,m,y]=s.split('/'); date=`${y}-${m}-${d}`; }
      else if (s.match(/^\d{4}-\d{2}-\d{2}$/)) date = s;
    });
    if (desc && amount) pendingImports.push({ description: desc, amount, date, category: guessCategory(desc), selected: true });
  });
}

function guessCategory(desc) {
  const d = desc.toLowerCase();
  if (/(uber|99|taxi|metro|onibus|bus|gasolina|combustivel|posto|estacio)/i.test(d)) return 'Transporte';
  if (/(ifood|rappi|mcdonalds|burger|pizza|restaurante|lanche|padaria|supermercado|mercado|carrefour|extra|atacadao)/i.test(d)) return 'Alimentação';
  if (/(netflix|spotify|amazon|disney|cinema|teatro|lazer|jogo|game|show)/i.test(d)) return 'Lazer';
  if (/(farmacia|medico|hospital|plano|saude|exame|drogaria)/i.test(d)) return 'Saúde';
  if (/(aluguel|condominio|luz|agua|energia|internet|telefone|gas|iptu)/i.test(d)) return 'Moradia';
  const cats = state.categories;
  for (const c of cats) { if (d.includes(c.name.toLowerCase())) return c.name; }
  return state.categories[0]?.name || 'Outros';
}

function showImportPreview() {
  const preview = document.getElementById('import-preview');
  const status  = document.getElementById('import-status');
  const actions = document.getElementById('import-actions');
  status.textContent = `${pendingImports.length} transações encontradas`;
  actions.classList.toggle('hidden', pendingImports.length === 0);
  if (!pendingImports.length) { preview.innerHTML = '<p class="text-slate-400 text-sm">Nenhuma transação reconhecida</p>'; return; }
  preview.innerHTML = `<table class="w-full text-xs">
    <thead><tr class="text-slate-400 border-b border-slate-700"><th></th><th class="text-left py-1">Descrição</th><th class="text-right py-1">Valor</th><th class="text-left py-1 pl-2">Categoria</th></tr></thead>
    <tbody>${pendingImports.map((t,i)=>`<tr class="border-b border-slate-700/30">
      <td><input type="checkbox" ${t.selected?'checked':''} onchange="pendingImports[${i}].selected=this.checked"></td>
      <td class="py-1 pr-2 text-slate-300 max-w-xs truncate">${escH(t.description)}</td>
      <td class="text-right text-red-400">${fmt(t.amount)}</td>
      <td class="pl-2"><select class="bg-slate-800 text-slate-300 text-xs rounded p-1" onchange="pendingImports[${i}].category=this.value">${catOptions(t.category)}</select></td>
    </tr>`).join('')}</tbody>
  </table>`;
}

async function confirmImport() {
  const toImport = pendingImports.filter(t=>t.selected);
  if (!toImport.length) { showToast('Nenhuma transação selecionada', 'error'); return; }
  const btn = document.querySelector('#import-actions button:last-child');
  setBtnLoading(btn, true);
  try {
    for (const t of toImport) {
      await api('POST', '/api/transactions', { type:'expense', description:t.description, amount:t.amount, category:t.category, date:t.date, isFixed:false, isRecurring:false, notes:'Importado' });
    }
    closeModal(); await loadAll(); render();
    showToast(`${toImport.length} transações importadas!`, 'success');
  } catch(err) { setBtnLoading(btn, false); showToast(err.message, 'error'); }
}
